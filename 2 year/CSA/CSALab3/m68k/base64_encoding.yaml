limit: 1000
memory_size: 2000

memory_mapped_io:
  0x80: [72, 101, 108, 108, 111, 33, 10]
  0x84: []

reports:
  - name: "Step-by-step"
    slice: all
    view: |
      {pc:hex}: {instruction:next} {pc:label}

  - name: "Result"
    slice: last
    view: |
      symio[0x84]: {io:0x84:sym}
      memory_dump: {memory:0x00:0x08}
    assert: |
      symio[0x84]: [] >>> ['S', 'G', 'V', 's', 'b', 'G', '8', 'h']