<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>web lab 1</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --hit: #10b981;
            --miss: #f43f5e;
            --text: #f8fafc;
            --muted-text: #cbd5e1;
            --border: #475569;
            --shadow: 0 8px 24px rgba(2, 6, 23, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            background-color: var(--bg-main);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: stretch;
            max-width: 1200px;
            min-height: 84px;
            margin: 0 auto 24px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            font-family: fantasy;
            color: var(--text);
            font-size: 16px;
        }

        header > div {
            border: 0;
        }

        header .name-and-group,
        header .title-and-variant {
            padding: 18px 22px;
        }

        header .name-and-group {
            font-size: 20px;
            font-weight: bold;
        }

        header .title-and-variant {
            width: 190px;
            margin-left: auto;
            color: var(--muted-text);
            text-align: right;
        }

        .title {
            color: var(--text);
            font-weight: bold;
        }

        .header-message {
            display: flex;
            flex: 1;
            align-items: center;
            padding: 12px 20px;
            color: var(--miss);
            white-space: pre-line;
            font-size: 19px
        }

        .header-message[hidden] {
            display: none;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
        }

        .layout-table {
            width: 100%;
            border-spacing: 0;
        }

        .inputs-cell,
        .canvas-cell {
            width: 50%;
            padding: 0 10px 24px;
            vertical-align: top;
        }

        .inputs,
        .canvas-card {
            min-height: 360px;
            padding: 24px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .canvas-card {
            min-height: 0;
        }

        .inputs h5 {
            margin-bottom: 10px;
            color: var(--muted-text);
            font-size: 14px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .inputs h5::before {
            content: "● ";
            color: var(--primary);
        }

        .x-input,
        .y-input,
        .r-input {
            margin-bottom: 22px;
        }

        input[type="number"],
        input[type="text"],
        select {
            min-height: 38px;
            padding: 8px 10px;
            color: var(--text);
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .r-button,
        #submitButton,
        #clearButton {
            min-height: 40px;
            padding: 8px 14px;
            border: 0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(2, 6, 23, 0.3);
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .r-button {
            margin: 3px;
            color: var(--text);
            background-color: var(--bg-main);
            border: 1px solid var(--border);
        }

        .r-button:hover,
        .r-button.active {
            color: var(--text);
            background-color: var(--primary);
            box-shadow: 0 4px 8px rgba(2, 6, 23, 0.35);
        }

        .r-button.active {
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.55);
        }

        #submitButton,
        #clearButton {
            width: 100%;
            margin-top: 10px;
            color: var(--text);
        }

        #submitButton {
            background-color: var(--primary);
        }

        #submitButton:hover {
            background-color: var(--primary-hover);
        }

        #submitButton:disabled {
            color: var(--muted-text);
            background-color: var(--border);
            cursor: not-allowed;
            box-shadow: none;
        }

        #clearButton {
            background-color: var(--miss);
        }

        #coordinate-plane {
            display: block;
            max-width: 100%;
            margin: auto;
            background-color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .res-table {
            width: 100%;
            overflow: hidden;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .res-table th,
        .res-table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border);
        }

        .res-table th {
            color: var(--muted-text);
            background-color: #263449;
            font-size: 13px;
            text-transform: uppercase;
        }

        .res-table tbody tr:nth-child(even) {
            background-color: #243247;
        }

        .res-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .status-hit,
        .status-miss {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-hit {
            color: #a7f3d0;
            background-color: rgba(16, 185, 129, 0.18);
        }

        .status-miss {
            color: #fecdd3;
            background-color: rgba(244, 63, 94, 0.18);
        }

        .status-invalid {
            color: #fde68a;
            background-color: rgba(245, 158, 11, 0.18);
        }

        @media (max-width: 760px) {
            body {
                padding: 12px;
            }

            header,
            .layout-table,
            .layout-table tbody,
            .layout-table tr {
                display: block;
            }

            header {
                min-height: 0;
            }

            header .title-and-variant {
                width: auto;
                margin-left: 0;
            }

            .inputs-cell,
            .canvas-cell {
                width: 100%;
                padding-right: 0;
                padding-left: 0;
            }

            .inputs,
            .canvas-card {
                min-height: 0;
            }

            .res-table {
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

<header>
    <div class="name-and-group">
        Ефимов Антон Дмитриевич
        <br>
        PЗ218
    </div>


    <div id="header-message" class="header-message" hidden>
        <span id="header-message-text"></span>
    </div>


    <div class="title-and-variant">
        <div class="title">
            Web Lab 1
        </div>

        <div class="variant">
            Var 22629
        </div>
    </div>
</header>

<main>
    <table class="layout-table">
        <tr>
            <td class="inputs-cell">
                <div class="inputs">
                    <form id="coords-form" onsubmit="submitForm(event)">
                        <div class="x-input">
                            <h5>Выберите X</h5>
                            <br>
                            X:
                            <select id="x-select">
                                <option value="-4">-4</option>
                                <option value="-3">-3</option>
                                <option value="-2">-2</option>
                                <option value="-1">-1</option>
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </div>

                        <div class="y-input">
                            <br>
                            <h5>Введите Y</h5>
                            <br>
                            <label>
                                Y:
                                <input id="YInput" type="text" inputmode="decimal" placeholder="  from -3 to 3" maxlength="6"/>
                            </label>
                        </div>

                        <div class="r-input">
                            <br>
                            <h5>Выберите R</h5>
                            <br>
                            R:
                            <button class="r-button" type="button" data-value="1"> 1 </button>
                            <button class="r-button" type="button" data-value="2"> 2 </button>
                            <button class="r-button" type="button" data-value="3"> 3 </button>
                            <button class="r-button" type="button" data-value="4"> 4 </button>
                            <button class="r-button" type="button" data-value="5"> 5 </button>
                        </div>

                        <br>
                        <button id="submitButton" type="submit">
                            Submit
                        </button>
                        <button id="clearButton" type="button">
                            Очистить таблицу
                        </button>
                    </form>
                </div>
            </td>
            <td class="canvas-cell">
                <div class="canvas-card">
                    <canvas id="coordinate-plane" width="450" height="450"></canvas>
                </div>
            </td>
        </tr>
    </table>

    <table class="res-table">
        <thead id="table-head">
            <tr>
                <th>X</th>
                <th>Y</th>
                <th>R</th>
                <th>Текущее время</th>
                <th>Результат</th>
            </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>
</main>

<script src="script.js"></script>


</body>
</html>
